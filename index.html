<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Minh Anh — Digital Transformation &amp; Operations Manager</title>
  <meta name="description" content="Portfolio của Nguyễn Minh Anh: hơn 9 năm cải tiến quy trình, chuyển đổi số và vận hành. Dự án, kết quả và cách làm việc.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nguyễn Minh Anh — Digital Transformation &amp; Operations Manager">
  <meta property="og:description" content="Hơn 9 năm cải tiến quy trình, chuyển đổi số và vận hành. Xem dự án và kết quả nổi bật.">
  <meta property="og:image" content="assets/images/avatar.jpg">
  <meta name="theme-color" content="#1f3864">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3864'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='%23fff'%3EMA%3C/text%3E%3C/svg%3E">
  <script>
    /* Áp theme sớm để tránh nháy màu */
    try { var t = localStorage.getItem('pf-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main" id="skip-link">Bỏ qua tới nội dung</a>

  <header class="topbar" id="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#top" aria-label="Nguyễn Minh Anh"><span class="brand-mark">MA</span><span class="brand-name">Nguyễn Minh Anh</span></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="tools">
        <button class="tool" id="lang-btn" type="button" aria-label="Đổi ngôn ngữ"><span id="lang-label">EN</span></button>
        <button class="tool" id="theme-btn" type="button" aria-label="Theme">
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="tool menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="wrap hero-in">
        <div class="hero-text">
          <p class="badge" id="hero-badge"></p>
          <h1 id="hero-name"></h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-tag" id="hero-tag"></p>
          <div class="cta">
            <a class="btn btn-primary" href="#projects" id="cta-projects"></a>
            <a class="btn btn-ghost" href="#contact" id="cta-contact"></a>
            <a class="btn btn-link" id="cta-cv" download></a>
          </div>
          <p class="hero-loc" id="hero-loc"></p>
        </div>
        <div class="hero-photo"><img id="hero-img" width="800" height="1000" alt=""></div>
      </div>
      <div class="wrap"><ul class="stats" id="hero-stats"></ul></div>
    </section>

    <section class="sec" id="about">
      <div class="wrap">
        <p class="kicker" id="about-kicker"></p>
        <h2 id="about-title"></h2>
        <div class="about-grid">
          <div>
            <p class="lead" id="about-summary"></p>
            <p id="about-approach"></p>
            <h3 id="interests-title" class="mini"></h3>
            <ul class="chips" id="interests"></ul>
            <p class="muted" id="about-outside"></p>
          </div>
          <div>
            <h3 id="principles-title" class="mini"></h3>
            <ol class="principles" id="principles"></ol>
          </div>
        </div>
      </div>
    </section>

    <section class="sec alt" id="results">
      <div class="wrap">
        <h2 id="results-title"></h2>
        <p class="sub" id="results-sub"></p>
        <div class="grid-results" id="highlights"></div>
      </div>
    </section>

    <section class="sec" id="projects">
      <div class="wrap">
        <h2 id="projects-title"></h2>
        <p class="sub" id="projects-sub"></p>
        <div class="grid-projects" id="project-cards"></div>
      </div>
    </section>

    <section class="sec alt" id="experience">
      <div class="wrap">
        <h2 id="experience-title"></h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="sec" id="skills">
      <div class="wrap">
        <h2 id="skills-title"></h2>
        <div class="grid-skills" id="skills-grid"></div>
        <h3 class="mini edu-title" id="education-title"></h3>
        <div class="edu" id="education"></div>
      </div>
    </section>

    <section class="sec alt" id="testimonials">
      <div class="wrap">
        <h2 id="testimonials-title"></h2>
        <div class="grid-quotes" id="quotes"></div>
      </div>
    </section>

    <section class="sec" id="contact">
      <div class="wrap contact-grid">
        <div>
          <h2 id="contact-title"></h2>
          <p class="lead" id="opp-intro"></p>
          <h3 class="mini" id="opp-title"></h3>
          <ul class="chips" id="opp-list"></ul>
          <ul class="links" id="contact-links"></ul>
        </div>
        <form class="form" id="contact-form" novalidate>
          <label><span id="lbl-name"></span><input id="f-name" name="name" type="text" autocomplete="name" required></label>
          <label><span id="lbl-email"></span><input id="f-email" name="email" type="email" autocomplete="email" required></label>
          <label><span id="lbl-msg"></span><textarea id="f-msg" name="message" rows="5" required></textarea></label>
          <input type="text" id="f-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
          <p class="form-err" id="form-err" role="alert" hidden></p>
          <p class="form-ok" id="form-ok" role="status" hidden></p>
          <button class="btn btn-primary" type="submit" id="f-send"></button>
          <p class="muted small" id="f-hint"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <p>© <span id="year"></span> Nguyễn Minh Anh</p>
      <p class="muted small" id="demo-note"></p>
      <div class="footer-tools">
        <button class="linkbtn" type="button" id="print-btn"></button>
        <a class="linkbtn" href="#top" id="top-link"></a>
      </div>
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" id="modal-panel" tabindex="-1">
      <div class="modal-bar">
        <div class="modal-nav">
          <button class="tool" type="button" id="modal-prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="tool" type="button" id="modal-next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <button class="tool" type="button" id="modal-close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="data/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
